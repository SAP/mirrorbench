run:
  name: exp1_goal_topic_gpt_4o_chatbot_arena_mirror
  seeds:
  - 0
  engine: async
  max_concurrency: 8
  timeout_seconds: 86400
  cache:
    enabled: true
  observability:
    log_json: false
    log_level: INFO
user_proxies:
- name: proxy:langchain/gpt-4o
  adapter: adapter:generic/llm
  params:
    model_client: client:langchain/chat
    client_params: &id002
      model_import: cached_scripts.ChatOpenAI
      model_kwargs:
        model: gpt-4o
        temperature: 0.2
    request_params: {}
datasets:
- name: dataset:jsonl/chatbot_arena_mirror
  split: default
  label: Chatbot Arena Mirror
  params:
    path: rebuttal_experiments/exp1_goal_ablation/data/chatbot_arena_mirror_goal_topic.jsonl
    max_examples: 200
metrics:
- name: metric:judge/gteval
  label: GTEval Realism
  params:
    judge_client_name: client:langchain/chat
    judge_params: &id001
      model_import: cached_scripts.ChatBedrockConverse
      model_kwargs:
        model: anthropic--claude-4-sonnet
        temperature: 0
    num_judge_samples: 1
    compute_controls: true
- name: metric:judge/pi_pairwise
  label: Pairwise Indistinguishability
  params:
    judge_client_name: client:langchain/chat
    judge_params: *id001
    num_judge_samples: 3
    compute_controls: true
- name: metric:judge/rubric_and_reason
  label: Rubric & Reason
  params:
    judge_client_name: client:langchain/chat
    judge_params: *id001
    num_judge_samples: 2
    compute_controls: true
scorecards:
- name: human_likeness
  weights:
    metric:judge/gteval: 1.0
    metric:judge/pi_pairwise: 1.0
    metric:judge/rubric_and_reason: 1.0
task_drivers:
  dataset:jsonl/chatbot_arena_mirror:
    driver: task:mirror/conversation
    params:
      assistant_model_client: client:langchain/chat
      client_params: *id002
      request_params: {}
